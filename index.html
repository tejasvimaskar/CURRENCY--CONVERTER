<!DOCTYPE html>
<html>
<head>
<title>Currency Converter Dashboard</title>

<!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- External CSS -->
<link rel="stylesheet" href="style.css">

</head>

<body>

<!-- HEADER -->
<header class="bg-dark text-white text-center p-3">
<h1>Currency Converter Dashboard</h1>
<p>Fast • Simple • Easy Currency Conversion</p>
</header>

<!-- NAVBAR -->
<nav class="bg-secondary text-center p-2">
<a href="#dashboard" class="text-white m-2">Dashboard</a>
<a href="#convert" class="text-white m-2">Converter</a>
<a href="#rates" class="text-white m-2">Rates</a>
<a href="#help" class="text-white m-2">Help</a>
<a href="#contact" class="text-white m-2">Contact</a>
<a href="#historySection" class="text-white m-2">History</a>
</nav>

<div class="container mt-4">

<!-- CONVERTER -->
<section id="convert" class="mb-4">
<div class="card p-4 shadow">

<h2 class="text-center">Currency Converter</h2>

<input type="number" id="amount" class="form-control mb-3" placeholder="Enter Amount">

<div class="row mb-2">
<div class="col">
<select id="from" class="form-select">
<option value="INR">INR (₹)</option>
<option value="USD">USD ($)</option>
<option value="EUR">EUR (€)</option>
</select>
</div>

<div class="col">
<select id="to" class="form-select">
<option value="USD">USD ($)</option>
<option value="INR">INR (₹)</option>
<option value="EUR">EUR (€)</option>
</select>
</div>
</div>

<button onclick="convert()" class="btn btn-dark w-100">Convert</button>

<p id="rateInfo" class="text-center mt-3"></p>

<div id="result" class="alert alert-info text-center mt-2">
Converted Amount: 0
</div>

</div>
</section>

<!-- HISTORY -->
<section id="historySection" class="mb-4">
<div class="card p-3">
<h4 class="text-center">Conversion History</h4>
<div id="history"></div>
<button onclick="clearHistory()" class="btn btn-danger mt-2 w-100">Clear History</button>
</div>
</section>

</div>

<!-- FOOTER -->
<footer class="bg-dark text-white text-center p-3">
<p>© 2026 Currency Converter Dashboard</p>
</footer>

<!-- ✅ External JS FILE LINK -->
<script src="final.js"></script>

</body>
</html>
